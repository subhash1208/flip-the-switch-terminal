[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "paritycourt"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["websockets", "httpx"]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "pytest-cov", "ruff", "mypy", "hypothesis"]

[tool.setuptools]
packages = ["bailiff", "bailiff.scripted"]

[tool.setuptools.package-data]
"bailiff.scripted" = ["fixtures/*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.coverage.run]
source = ["bailiff"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_also = ['if __name__ == "__main__":']
