name: CI

on:
  push:
    branches:
      - "feature/**"
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint-type-test:
    name: lint, types, tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package with dev extras
        run: python -m pip install -e ".[dev]"

      - name: Ruff lint
        run: python -m ruff check bailiff tests scripts

      - name: Ruff format
        run: python -m ruff format --check bailiff tests scripts

      - name: Mypy
        run: python -m mypy bailiff

      - name: Pytest with coverage gate (fail_under 90 from pyproject)
        run: python -m pytest -q --cov=bailiff --cov-branch --cov-report=term-missing --cov-report=xml

      - name: Offline demo to a temp receipt
        run: python -m bailiff.demo --offline --receipt "$RUNNER_TEMP/receipt.json"

      - name: Judge (offline)
        run: python scripts/judge.py --no-docker

      - name: Upload coverage.xml
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error
          retention-days: 14

  security:
    name: security scans
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out (full history for gitleaks)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package with dev extras and scanners
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install bandit==1.9.4 pip-audit==2.10.1

      - name: Bandit (medium and high severity)
        run: python -m bandit -r bailiff scripts -ll

      - name: pip-audit (installed environment)
        run: pip-audit

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  node:
    name: node ${{ matrix.node-version }} planted bug (expect ${{ matrix.expect }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: sample-app/export-service
    strategy:
      fail-fast: false
      matrix:
        include:
          - node-version: "18"
            expect: fail
          - node-version: "22"
            expect: pass
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run test.js and assert the planted-bug outcome
        shell: bash
        env:
          EXPECT_MAJOR: ${{ matrix.node-version }}
          EXPECT: ${{ matrix.expect }}
        run: |
          set -uo pipefail
          node_major="$(node -p 'process.versions.node.split(".")[0]')"
          if [ "$node_major" != "$EXPECT_MAJOR" ]; then
            echo "::error::expected Node $EXPECT_MAJOR, found $node_major"
            exit 1
          fi
          set +e
          node test.js > "$RUNNER_TEMP/stdout.txt" 2> "$RUNNER_TEMP/stderr.txt"
          code=$?
          set -e
          echo "--- stdout ---"
          cat "$RUNNER_TEMP/stdout.txt"
          echo "--- stderr ---"
          cat "$RUNNER_TEMP/stderr.txt"
          echo "exit code: $code"
          if [ "$EXPECT" = "pass" ]; then
            if [ "$code" -ne 0 ]; then
              echo "::error::Node $node_major: expected exit 0, got $code"
              exit 1
            fi
          else
            if [ "$code" -eq 0 ]; then
              echo "::error::Node $node_major: expected a failure, got exit 0"
              exit 1
            fi
            if ! grep -q "toSorted is not a function" "$RUNNER_TEMP/stderr.txt"; then
              echo "::error::Node $node_major: stderr lacks 'toSorted is not a function'"
              exit 1
            fi
          fi
          echo "Node $node_major outcome matches expectation: $EXPECT"

  judge-path:
    name: live judge path (Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Validate compose file
        run: docker compose -f deploy/docker-compose.yml config -q

      - name: Run live judge path (alice and bob containers)
        shell: bash
        run: |
          set -o pipefail
          python scripts/check_judge_path.py 2>&1 | tee "$RUNNER_TEMP/judge-path.txt"

      - name: Upload judge-path output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: judge-path-output
          path: ${{ runner.temp }}/judge-path.txt
          if-no-files-found: warn
          retention-days: 14

  workflows-lint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install actionlint 1.7.12 (SHA-256 verified)
        env:
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl -fsSL -o "$archive" "https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint

      - name: Lint workflows
        run: '"$RUNNER_TEMP/actionlint"'

  ci-ok:
    name: ci-ok
    if: always()
    needs: [lint-type-test, security, node, judge-path, workflows-lint]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      LINT_TYPE_TEST: ${{ needs.lint-type-test.result }}
      SECURITY: ${{ needs.security.result }}
      NODE: ${{ needs.node.result }}
      JUDGE_PATH: ${{ needs.judge-path.result }}
      WORKFLOWS_LINT: ${{ needs.workflows-lint.result }}
    steps:
      - name: Require every required job to succeed
        shell: bash
        run: |
          status=0
          check() {
            echo "$1: $2"
            if [ "$2" != "success" ]; then status=1; fi
          }
          check lint-type-test "$LINT_TYPE_TEST"
          check security "$SECURITY"
          check node "$NODE"
          check judge-path "$JUDGE_PATH"
          check workflows-lint "$WORKFLOWS_LINT"
          exit "$status"
