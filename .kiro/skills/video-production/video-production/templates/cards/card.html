<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    background: #0c0d11;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    display: flex; align-items: center; justify-content: center;
    position: relative;
  }
  .glow {
    position: absolute; width: 1400px; height: 1400px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,217,0,0.10) 0%, rgba(255,217,0,0.03) 40%, transparent 70%);
    top: 50%; left: 50%; transform: translate(-50%, -50%);
    animation: breathe 6s ease-in-out infinite;
  }
  @keyframes breathe { 0%,100% { transform: translate(-50%,-50%) scale(1); } 50% { transform: translate(-50%,-50%) scale(1.12); } }
  .grid {
    position: absolute; inset: 0;
    background-image: linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
    background-size: 64px 64px;
    mask-image: radial-gradient(ellipse 70% 60% at 50% 50%, black 30%, transparent 75%);
    -webkit-mask-image: radial-gradient(ellipse 70% 60% at 50% 50%, black 30%, transparent 75%);
    animation: drift 8s linear infinite;
  }
  @keyframes drift { from { background-position: 0 0, 0 0; } to { background-position: 64px 64px, 64px 64px; } }
  .content { position: relative; text-align: center; z-index: 2; padding: 0 120px; }
  .kicker {
    display: inline-flex; align-items: center; gap: 12px;
    font-size: 22px; font-weight: 600; letter-spacing: 0.35em; text-transform: uppercase;
    color: #FFD900; margin-bottom: 36px;
    opacity: 0; animation: fadeUp 0.9s cubic-bezier(0.16,1,0.3,1) 0.15s forwards;
  }
  .kicker::before, .kicker::after {
    content: ''; display: block; width: 56px; height: 1px;
    background: linear-gradient(90deg, transparent, #FFD900);
  }
  .kicker::after { background: linear-gradient(90deg, #FFD900, transparent); }
  h1 {
    font-size: 110px; font-weight: 800; line-height: 1.08; color: #f5f5f4;
    letter-spacing: -0.02em;
    opacity: 0; animation: fadeUp 1s cubic-bezier(0.16,1,0.3,1) 0.4s forwards;
  }
  h1 .accent { color: #FFD900; }
  .subtitle {
    font-size: 34px; font-weight: 400; color: #a1a1aa; margin-top: 30px;
    opacity: 0; animation: fadeUp 1s cubic-bezier(0.16,1,0.3,1) 0.7s forwards;
  }
  .bar {
    width: 0; height: 4px; border-radius: 2px; margin: 48px auto 0;
    background: linear-gradient(90deg, #FFD900, #E5C300);
    animation: grow 1.4s cubic-bezier(0.16,1,0.3,1) 1s forwards;
  }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(36px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes grow { from { width: 0; } to { width: 180px; } }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="grid"></div>
  <div class="content">
    <div class="kicker" id="kicker"></div>
    <h1 id="title"></h1>
    <div class="subtitle" id="subtitle"></div>
    <div class="bar"></div>
  </div>
<script>
  const p = new URLSearchParams(location.search);
  document.getElementById('kicker').textContent = p.get('kicker') || '';
  document.getElementById('title').innerHTML = p.get('title') || '';
  document.getElementById('subtitle').textContent = p.get('subtitle') || '';
</script>
</body>
</html>
